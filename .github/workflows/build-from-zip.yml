
name: Build KENO from ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract and repair KENO source
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          test -n "$ZIP_FILE"
          mkdir project
          unzip -q "$ZIP_FILE" -d project

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("project/app/src/main/java/com/keno/billiards/core/TableDetector.kt")
          if not p.exists():
              raise SystemExit("TableDetector.kt not found")

          s = p.read_text()
          lines = s.splitlines()
          lines[8] = "        for (y in (step until (frame.height - step)).step(step)) for (x in (step until (frame.width - step)).step(step)) {"
          s = "\n".join(lines) + "\n"
          s = re.sub(r'(?<![\w.])\.(\d+)', r'0.\1', s)
          p.write_text(s)
          PY

      - name: Show KENO overlay source
        shell: bash
        run: |
          FILE="project/app/src/main/java/com/keno/billiards/overlay/KenoOverlayService.kt"
          echo "===== KENO_OVERLAY_SOURCE_START ====="
          if [ -f "$FILE" ]; then
            cat "$FILE"
          else
            echo "FILE NOT FOUND"
            find project/app/src/main/java -iname "*OverlayService*"
          fi
          echo "===== KENO_OVERLAY_SOURCE_END ====="

      - name: Build APK
        run: |
          cd project
          gradle --no-daemon assembleDebug

      - name: Upload KENO APK
        uses: actions/upload-artifact@v4
        with:
          name: KENO-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
