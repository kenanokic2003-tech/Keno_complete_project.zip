
name: Build KENO from ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract and fix KENO project
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          test -n "$ZIP_FILE"
          mkdir project
          unzip -q "$ZIP_FILE" -d project

          TABLE_FILE="project/app/src/main/java/com/keno/billiards/core/TableDetector.kt"
          test -f "$TABLE_FILE"

          sed -i 's/\* *\.035/* 0.035/g' "$TABLE_FILE"

      - name: Build APK
        run: |
          cd project
          gradle --no-daemon assembleDebug

      - name: Upload KENO APK
        uses: actions/upload-artifact@v4
        with:
          name: KENO-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

